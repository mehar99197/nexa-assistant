<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may own and talk to org.nexa.Helper on the system bus. Installed to
  /etc/dbus-1/system.d/org.nexa.Helper.conf.

  Only root may own the name, so nothing else can impersonate the helper.

  Sending to it is left open, because D-Bus is the wrong place to decide this: the bus can only
  say yes or no to the whole service, while polkit can ask the person at the keyboard, per action,
  once per session. So every method is authorised by polkit instead (see
  org.nexa.helper.policy), and polkit refuses sessions that are not active — which is what keeps a
  second logged-in user or a background process from using it.
-->
<busconfig>

  <policy user="root">
    <allow own="org.nexa.Helper"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.nexa.Helper"/>
    <allow receive_sender="org.nexa.Helper"/>
  </policy>

</busconfig>
