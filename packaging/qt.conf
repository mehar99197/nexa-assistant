; Built into the packaged nexa-assistant as :/qt/etc/qt.conf (app/CMakeLists.txt, NEXA_PACKAGED): the binary is
; /usr/bin/nexa-assistant and Qt's plugins are bundled in /usr/lib/nexa-assistant/plugins. Paths are relative to
; the binary's folder.
[Paths]
Prefix = ../lib/nexa-assistant
Plugins = plugins
