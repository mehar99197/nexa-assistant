<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="color-scheme" content="dark">
<title>Nexa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <span class="brand">Nexa</span>
  <span id="status" class="status">connecting…</span>
</header>

<section id="pair" hidden>
  <h1>Pair this phone</h1>
  <p>On the PC, open <b>Settings → Remote</b> and press <b>Pair a phone</b>. Scan the QR code it shows, or enter its six digits here.</p>
  <form id="pair-form" autocomplete="off">
    <input id="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" aria-label="Pairing code" required>
    <input id="pair-name" maxlength="60" placeholder="Name for this phone" aria-label="Name for this phone">
    <button type="submit">Pair</button>
  </form>
  <p id="pair-error" class="error" role="alert"></p>
</section>

<main id="chat" hidden>
  <ol id="messages" aria-live="polite"></ol>
  <form id="ask" autocomplete="off">
    <textarea id="text" rows="1" placeholder="Ask Nexa…" aria-label="Request"></textarea>
    <button id="talk" type="button" aria-label="Hold to talk" title="Hold to talk" hidden>🎙</button>
    <button id="send" type="submit" aria-label="Send">➤</button>
  </form>
</main>
</body>
</html>
