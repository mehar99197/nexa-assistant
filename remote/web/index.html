<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D1014">
<meta name="color-scheme" content="dark light">
<title>Nexa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <span class="brand"><span id="brand-core" class="core core-mark" aria-hidden="true"></span>Nexa</span>
  <span id="status" class="pill"><span class="dot" aria-hidden="true"></span><span id="status-text">connecting…</span></span>
</header>

<section id="pair" hidden>
  <div id="pair-core" class="core core-pair" aria-hidden="true"></div>
  <h1>Pair this phone</h1>
  <p>On the PC, open <b>Settings → Remote</b> and press <b>Pair a phone</b>. Scan the QR code it shows, or enter its six digits here.</p>
  <form id="pair-form" autocomplete="off">
    <input id="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" aria-label="Pairing code" required>
    <input id="pair-name" maxlength="60" placeholder="Name for this phone" aria-label="Name for this phone">
    <button type="submit" class="primary">Pair</button>
  </form>
  <p id="pair-error" class="error" role="alert"></p>
</section>

<main id="chat" hidden>
  <section id="presence">
    <div id="core" class="core core-presence mode-idle" aria-hidden="true"></div>
    <div class="presence-text">
      <h1 id="state">Ready</h1>
      <p id="hint">Say a request, or type one.</p>
    </div>
  </section>
  <ol id="messages" aria-live="polite"></ol>
  <form id="ask" autocomplete="off">
    <textarea id="text" rows="1" placeholder="Type a request" aria-label="Request"></textarea>
    <button id="send" type="submit" aria-label="Send">
      <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
    </button>
  </form>
  <div id="talk-row" hidden>
    <button id="talk" type="button" aria-label="Talk"><span id="talk-core" class="core core-button mode-idle" aria-hidden="true"></span></button>
    <p id="talk-hint">Tap to talk. Hold for push-to-talk.</p>
  </div>
</main>
</body>
</html>
